apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  strategy: {}
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: schoolofdevops/vote:v4
        name: vote
        resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: result
  annotations:
    external-dns.alpha.kubernetes.io/hostname: tl-vote-dev.dev.cyber.burrito.cloud
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  ports:
    - port: 80
  selector:
    app: vote
